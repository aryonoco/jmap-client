# =============================================================================
# jmap-client CI Workflow
# Runs REUSE compliance, format check, lint, analyse, and tests on every push and PR
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  reuse:
    name: REUSE Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  ci:
    name: Format, Lint, Analyse, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # Before the grep below trusts mise.toml, confirm the other three
      # sites agree with it — otherwise CI silently builds and tests a
      # compiler that neither the devcontainer nor consumers will use.
      - name: Lint (Nim version drift)
        run: just lint-nim-version

      - name: Read NIM_VERSION from mise.toml
        run: |
          NIM_VERSION=$(grep 'NIM_VERSION' mise.toml | sed 's/.*= *"\(.*\)"/\1/')
          echo "NIM_VERSION=$NIM_VERSION" >> $GITHUB_ENV
          echo "Nim version: $NIM_VERSION"

      - name: Cache Nim toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: nim-cache
        with:
          path: |
            ~/nim-${{ env.NIM_VERSION }}
            ~/nim
            ~/.nimble/bin
            ~/.nimble/pkgs2
          key: nim-${{ runner.os }}-${{ env.NIM_VERSION }}-${{ hashFiles('*.nimble') }}
          restore-keys: |
            nim-${{ runner.os }}-${{ env.NIM_VERSION }}-

      - name: Install Nim from source
        if: steps.nim-cache.outputs.cache-hit != 'true'
        run: |
          cd ~
          curl -LO "https://nim-lang.org/download/nim-${{ env.NIM_VERSION }}.tar.xz"
          tar xf "nim-${{ env.NIM_VERSION }}.tar.xz"
          cd "nim-${{ env.NIM_VERSION }}"
          sh build.sh
          ./bin/nim c -d:release koch
          ./koch boot -d:release
          ./koch nimble
          ./bin/nim c -d:release -o:bin/testament testament/testament.nim
          cd ..
          ln -sf "nim-${{ env.NIM_VERSION }}" nim
          rm -f "nim-${{ env.NIM_VERSION }}.tar.xz"

      - name: Add tools to PATH
        run: |
          echo "$HOME/nim/bin" >> $GITHUB_PATH
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH

      # nph is built from source via nimble: upstream's GitHub release for
      # aarch64 contains the x86_64 binary, so mise cannot reliably provide
      # it. Mirrors .devcontainer/scripts/post-create.sh — keep versions in
      # sync.
      - name: Install nph
        run: nimble install nph@0.7.0 --accept

      - name: Verify toolchain
        run: |
          nim --version
          nimble --version
          nph --version
          just --version

      - name: Install PCRE1
        run: |
          curl -sLO http://deb.debian.org/debian/pool/main/p/pcre3/libpcre3_8.39-15_amd64.deb
          sudo dpkg -i libpcre3_8.39-15_amd64.deb
          rm libpcre3_8.39-15_amd64.deb

      - name: Install project dependencies
        run: |
          rm -rf ~/.nimble/pkgs2/nim-*
          nimble install -d --accept
          nimble setup
          rm -rf ~/.nimble/pkgs2/nim-*

      # Pinned because src/ carries {.ruleOff.} pragmas placed around
      # specific 0.12.2 rule bugs, and CLAUDE.md forbids relaxing rules to
      # suit the analyser. Mirrors .devcontainer/scripts/post-create.sh —
      # keep versions in sync.
      - name: Install nimalyzer
        run: nimble install nimalyzer@0.12.2 --accept

      - name: Check formatting
        run: just fmt-check

      - name: Lint
        run: just lint

      - name: Lint (isolated)
        run: just lint-isolated

      - name: Lint (style)
        run: just lint-style

      - name: Lint (defect audits)
        run: just lint-defect-audits

      - name: Static analysis
        run: just analyse

      - name: Build shared library
        run: just build

      - name: Lint (C header inventory)
        run: just lint-c-header

      - name: Lint (C header drift)
        run: just lint-c-header-snapshot

      - name: Lint (C header types)
        run: just lint-c-header-types

      - name: Run C compliance tests
        run: just test-c

      # Build only. The bench needs a live JMAP server to do anything,
      # so running it stays manual, like the Nim bench.
      - name: Build the C consumer bench
        run: just build-c-bench

      - name: Run tests
        run: just test
